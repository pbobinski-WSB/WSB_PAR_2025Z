<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Aplikacja To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Moja Lista Zadań</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Wpisz nowe zadanie..." required>
            <button type="submit">Dodaj</button>
        </form>
        <ul id="task-list">
            <!-- Zadania będą renderowane tutaj przez JavaScript -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
